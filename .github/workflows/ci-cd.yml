name: TriviaVerse CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia123
          POSTGRES_DB: triviaverse_test
        ports:
          - 5438:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest psycopg2-binary

      - name: Syntax check (all app code)
        run: |
          python -m compileall -q app config.py run.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql://trivia:trivia123@localhost:5438/triviaverse_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          FLASK_ENV: testing
        run: |
          # FIX-017: test failures must fail the pipeline — never hide them.
          python -m pytest tests/ -q --tb=short

      - name: Build Docker image (validates Dockerfile)
        run: docker build -t triviaverse:${{ github.sha }} .

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t triviaverse:${{ github.sha }} .

      - name: Deploy notification
        run: echo "Deployment to production would happen here"
