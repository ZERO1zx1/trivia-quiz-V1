{% extends "layouts/base.html" %}
{% block title %}Verify 2FA Code{% endblock %}
{% block content %}
<div class="container mx-auto max-w-md mt-20">
    <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-8 border border-purple-500/20 text-center">
        <div class="text-4xl mb-4">🔐</div>
        <h1 class="text-2xl font-bold text-white mb-2">Two-Factor Authentication</h1>
        <p class="text-gray-400 mb-6">Enter the 6-digit code from your authenticator app</p>

        <form method="POST" action="{{ url_for('two_factor.verify') }}" class="space-y-4">
            <input type="text" name="code" maxlength="6" required autofocus
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-4 text-white text-center text-2xl tracking-widest"
                   placeholder="000000">
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-semibold transition">
                Verify
            </button>
        </form>

        <p class="text-gray-500 text-sm mt-4">
            Lost your authenticator? Contact support for help.
        </p>
    </div>
</div>
{% endblock %}
