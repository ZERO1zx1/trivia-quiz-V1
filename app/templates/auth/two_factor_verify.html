{% extends "layouts/base.html" %}
{% block title %}Verify two-factor code · {{ app_name }}{% endblock %}
{% block guest_content %}
<div class="auth-page">
    <div class="auth-bg" aria-hidden="true"><div class="gradient-orb orb-1"></div><div class="gradient-orb orb-2"></div></div>
    <section class="auth-container" aria-labelledby="two-factor-verify-title">
        <div class="auth-card glass auth-card--verification">
            <header class="auth-header"><span class="logo-icon" aria-hidden="true">⌁</span><h1 id="two-factor-verify-title">Two-factor authentication</h1><p>Enter the current six-digit code from your authenticator app.</p></header>
            <form method="POST" action="{{ url_for('two_factor.verify') }}" class="auth-form">
                <div class="form-group otp-group"><label for="two-factor-code">Authentication code</label><input type="text" id="two-factor-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus placeholder="000000"></div>
                <button type="submit" class="btn btn-primary btn-full">Verify code <span aria-hidden="true">→</span></button>
            </form>
            <footer class="auth-footer">Lost access to your authenticator? Contact support for help.</footer>
        </div>
    </section>
</div>
{% endblock %}
