{% extends "layouts/base.html" %}
{% block title %}AI Coach{% endblock %}
{% block content %}
<div class="container mx-auto mt-10 px-4">
    <h1 class="text-3xl font-bold text-white mb-8">AI Coach 🤖</h1>

    <!-- Coach Advice Card -->
    <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-6 border border-purple-500/20 mb-8">
        <h2 class="text-xl font-semibold text-purple-400 mb-4">Personalized Advice</h2>
        <div id="coach-advice" class="text-gray-300">
            <p>Loading...</p>
        </div>
        <button onclick="loadAdvice()" class="mt-4 bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition">
            Refresh Advice
        </button>
    </div>

    <!-- Category Performance -->
    <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-6 border border-blue-500/20">
        <h2 class="text-xl font-semibold text-blue-400 mb-4">Category Performance</h2>
        <div id="category-stats" class="space-y-3">
            <p class="text-gray-400">Loading...</p>
        </div>
    </div>
</div>

<script>
async function loadAdvice() {
    try {
        const res = await fetch('/ai-coach/api/coach/advice');
        const data = await res.json();
        const el = document.getElementById('coach-advice');
        if (data.advice) {
            el.innerHTML = `<p class="text-lg">${data.advice}</p>`;
        } else {
            el.innerHTML = '<p class="text-gray-400">No advice available yet. Play some games first!</p>';
        }
    } catch(e) {
        document.getElementById('coach-advice').innerHTML = '<p class="text-red-400">Error loading advice.</p>';
    }
}

async function loadCategories() {
    try {
        const res = await fetch('/ai-coach/api/coach/categories');
        const data = await res.json();
        const el = document.getElementById('category-stats');
        if (data.categories && data.categories.length > 0) {
            let html = '';
            data.categories.forEach(cat => {
                const color = cat.accuracy >= 70 ? 'text-green-400' : cat.accuracy >= 40 ? 'text-yellow-400' : 'text-red-400';
                html += `
                    <div class="flex justify-between items-center bg-gray-900/50 rounded-lg p-3">
                        <span class="text-white">${cat.name}</span>
                        <div class="flex items-center gap-4">
                            <span class="text-gray-400 text-sm">${cat.correct}/${cat.total}</span>
                            <span class="${color} font-bold">${cat.accuracy}%</span>
                            <div class="w-24 h-2 bg-gray-700 rounded-full">
                                <div class="h-2 rounded-full ${cat.accuracy >= 70 ? 'bg-green-500' : cat.accuracy >= 40 ? 'bg-yellow-500' : 'bg-red-500'}"
                                     style="width: ${cat.accuracy}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            });
            el.innerHTML = html;
        } else {
            el.innerHTML = '<p class="text-gray-400">No category data yet. Play some games to see your stats!</p>';
        }
    } catch(e) {
        document.getElementById('category-stats').innerHTML = '<p class="text-red-400">Error loading stats.</p>';
    }
}

loadAdvice();
loadCategories();
</script>
{% endblock %}
