{% extends "layouts/base.html" %}
{% block title %}{{ channel.name }} - {{ app_name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ channel.name }}</h1>
    <p class="text-muted">{{ channel.description }}</p>
</div>

<div class="chat-container glass">
    <div class="chat-messages" id="chat-messages">
        <!-- Messages will be loaded by ChatSystem -->
    </div>

    <div class="chat-input-area">
        <form id="chat-form">
            <input type="hidden" id="chat-channel-id" value="{{ channel.id }}">
            <input type="text" id="chat-input" placeholder="{{ _('Type a message...') }}" required maxlength="2000">
            <button type="submit" class="btn btn-primary">{{ _('Send') }}</button>
        </form>
        <div id="typing-indicator" class="text-xs text-muted mt-1" style="display:none;"></div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    ChatSystem.init({
        channelId: {{ channel.id }},
        userId: {{ current_user.id }},
        username: "{{ current_user.username }}"
    });
});
</script>
{% endblock %}
