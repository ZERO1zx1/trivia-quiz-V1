{% extends "base.html" %}
{% block title %}Create Guild - TriviaVerse{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-3xl font-bold text-white mb-8">🏰 Create a Guild</h1>

    <form method="POST" class="bg-gray-800 rounded-xl p-8 space-y-6">
        <div>
            <label class="block text-gray-300 mb-2">Guild Name</label>
            <input type="text" name="name" required minlength="3" maxlength="50"
                   class="input-field w-full" placeholder="Enter guild name...">
            <p class="text-gray-500 text-sm mt-1">3-50 characters</p>
        </div>

        <div>
            <label class="block text-gray-300 mb-2">Guild Tag</label>
            <input type="text" name="tag" required minlength="2" maxlength="10"
                   class="input-field w-full" placeholder="ABC" style="text-transform: uppercase;">
            <p class="text-gray-500 text-sm mt-1">2-10 characters, will be displayed as [TAG]</p>
        </div>

        <div>
            <label class="block text-gray-300 mb-2">Description</label>
            <textarea name="description" rows="4" class="input-field w-full"
                      placeholder="Describe your guild..."></textarea>
        </div>

        <button type="submit" class="btn-primary w-full py-3 text-lg">
            Create Guild (Cost: 1,000 coins)
        </button>
    </form>
</div>
{% endblock %}
