{% extends "layouts/base.html" %}
{% block title %}Create Tournament - TriviaVerse{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-3xl font-bold text-white mb-8">🏆 Create Tournament</h1>

    <form method="POST" class="bg-gray-800 rounded-xl p-8 space-y-6">
        <div>
            <label class="block text-gray-300 mb-2">Tournament Name</label>
            <input type="text" name="name" required class="input-field w-full" placeholder="Enter tournament name...">
        </div>

        <div>
            <label class="block text-gray-300 mb-2">Description</label>
            <textarea name="description" rows="3" class="input-field w-full" placeholder="Describe the tournament..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-300 mb-2">Type</label>
                <select name="type" class="input-field w-full">
                    <option value="bracket">Bracket</option>
                    <option value="round_robin">Round Robin</option>
                    <option value="ladder">Ladder</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-300 mb-2">Category</label>
                <select name="category" class="input-field w-full">
                    <option value="general">General</option>
                    <option value="science">Science</option>
                    <option value="history">History</option>
                    <option value="geography">Geography</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="sports">Sports</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-300 mb-2">Difficulty</label>
                <select name="difficulty" class="input-field w-full">
                    <option value="mixed">Mixed</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-300 mb-2">Max Participants</label>
                <input type="number" name="max_participants" value="32" min="4" max="128" class="input-field w-full">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-300 mb-2">Entry Fee (coins)</label>
                <input type="number" name="entry_fee" value="0" min="0" class="input-field w-full">
            </div>
            <div>
                <label class="block text-gray-300 mb-2">Prize Pool (coins)</label>
                <input type="number" name="prize_pool" value="0" min="0" class="input-field w-full">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-300 mb-2">Start Time</label>
                <input type="datetime-local" name="start_time" class="input-field w-full">
            </div>
            <div>
                <label class="block text-gray-300 mb-2">End Time</label>
                <input type="datetime-local" name="end_time" class="input-field w-full">
            </div>
        </div>

        <div class="flex items-center gap-4">
            <label class="flex items-center gap-2 text-gray-300">
                <input type="checkbox" name="is_ranked" class="w-4 h-4"> Ranked Tournament
            </label>
        </div>

        <button type="submit" class="btn-primary w-full py-3 text-lg">Create Tournament</button>
    </form>
</div>
{% endblock %}
