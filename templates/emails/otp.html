<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .header { text-align: center; color: #5865F2; }
        .otp { font-size: 32px; font-weight: bold; text-align: center; letter-spacing: 5px; margin: 30px 0; color: #333; }
        .footer { font-size: 12px; color: #888; text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TriviaVerse</h1>
        </div>
        <p>Hello {{ user.username }},</p>
        <p>Use the following code to verify your account. This code is valid for 10 minutes.</p>
        <div class="otp">{{ otp }}</div>
        <p>If you did not request this, please ignore this email.</p>
        <div class="footer">
            &copy; 2026 TriviaVerse Team
        </div>
    </div>
</body>
</html>
