# TriviaVerse Nginx Configuration
# Handles reverse proxy + WebSocket support + static files

# FIX-018: upstream must resolve to the Docker Compose service name (`web`);
# the original `app` hostname does not exist and would fail to start.
upstream triviaverse {
    server web:5000;
}

server {
    listen 80;
    server_name _;

    # FIX-018: real rate-limit zone definitions. The previous config only had
    # a commented-out limit_req whose referenced zone was never defined, so
    # nginx could not start if uncommented.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req zone=general burst=40 nodelay;

    # Static files
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # FIX-018: health endpoint answers directly from nginx (plain HTTP
    # load-balancer checks must not traverse the whole stack).
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # WebSocket support (Socket.IO)
    location /socket.io/ {
        proxy_pass http://triviaverse;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Application proxy
    location / {
        proxy_pass http://triviaverse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression for text responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
