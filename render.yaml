services:
  - type: web
    name: triviaverse
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: GUNICORN_WORKER_CLASS
        value: eventlet
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet
      - key: AUTO_INIT_DATABASE
        value: "0"
      - key: ENABLE_SCHEDULER
        value: "0"
      - key: LOG_TO_FILE
        value: "0"
      - key: SUPABASE_URL
        value: https://rqohugxyvdomjmcvknde.supabase.co
      - key: SUPABASE_AUTH_ENABLED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SOCKETIO_CORS_ALLOWED_ORIGINS
        sync: false
