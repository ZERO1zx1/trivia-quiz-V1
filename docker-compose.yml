# TriviaVerse Docker Compose
# Full stack: App + PostgreSQL + Redis + Nginx
services:
  db:
    image: postgres:17-alpine
    container_name: triviaverse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: triviaverse
      POSTGRES_USER: triviaverse
      # FIX-018: never ship hardcoded credentials; source the password from a
      # Docker secret (file-backed, not baked into the image or compose file).
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triviaverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: triviaverse_redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: triviaverse_web
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_ENV: production
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must include the Docker database password}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SOCKETIO_CORS_ALLOWED_ORIGINS: ${SOCKETIO_CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["gunicorn", "--config", "gunicorn.conf.py", "run:app"]

  nginx:
    image: nginx:alpine
    container_name: triviaverse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # FIX-018: the original file referenced ./nginx.conf which does not
      # exist; point at the repository file that does.
      - ./nginx/conf.d/triviaverse.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

secrets:
  db_password:
    file: .secrets/db_password.txt

volumes:
  pgdata:
